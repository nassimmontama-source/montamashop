<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout | Montama</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

    <a href="index.html" class="logo">
        MONTAMA
    </a>

</header>


<main class="section">


    <div class="section-title">

        <p class="eyebrow">
            MONTAMA
        </p>

        <h1>
            CHECKOUT
        </h1>

    </div>


    <form
        id="checkoutForm"
        class="checkout-form">


        <input
            name="name"
            required
            placeholder="Full name">


        <input
            name="phone"
            required
            placeholder="Phone number">


        <input
            name="city"
            required
            placeholder="City">


        <input
            name="address"
            required
            placeholder="Delivery address">


        <select name="payment">

            <option>
                Cash on Delivery
            </option>

        </select>


        <button
            class="button"
            type="submit">

            PLACE ORDER

        </button>


    </form>


    <div id="checkoutMessage"></div>


</main>


<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>

</body>

</html>
